name: CI, imagem e deploy

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: marketplace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Compilar e testar
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Validar projeto
        run: mvn --batch-mode clean verify

  publicar-imagem:
    name: Publicar imagem no GHCR
    needs: validar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Definir nome da imagem em letras minúsculas
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags e metadados
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,format=long

      - name: Construir e publicar imagem
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ambiente-atual:
    name: Atualizar ambiente atual
    needs: publicar-imagem
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: atual
    steps:
      - name: Validar configuração do ambiente
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "Configure o secret DEPLOY_HOOK_URL no environment 'atual'."
            exit 1
          fi

      - name: Disparar atualização automática
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
          IMAGE: ${{ needs.publicar-imagem.outputs.image }}
          DIGEST: ${{ needs.publicar-imagem.outputs.digest }}
        shell: bash
        run: |
          curl --fail-with-body \
            --retry 3 \
            --retry-all-errors \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"image\":\"${IMAGE}\",\"digest\":\"${DIGEST}\",\"tag\":\"latest\"}" \
            "$DEPLOY_HOOK_URL"
